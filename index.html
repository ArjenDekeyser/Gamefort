<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamefort - Battle Royale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
            color: #fff;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Overlay */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Minimap */
        .minimap {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            pointer-events: auto;
        }

        .minimap-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Health/Ammo Bar */
        .player-stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #00d4ff;
            min-width: 250px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-weight: bold;
            color: #00d4ff;
            min-width: 100px;
        }

        .stat-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin: 0 10px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.2s ease;
        }

        .health-bar .stat-bar-fill {
            background: #00ff00;
        }

        .shield-bar .stat-bar-fill {
            background: #00d4ff;
        }

        .stat-value {
            min-width: 40px;
            text-align: right;
        }

        /* Inventory */
        .inventory {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            border-right: 4px solid #ff6b00;
            min-width: 250px;
            max-height: 300px;
            overflow-y: auto;
        }

        .inventory-title {
            color: #ff6b00;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            font-size: 12px;
            border-left: 3px solid #ff6b00;
        }

        .inventory-item-name {
            flex: 1;
        }

        .inventory-item-count {
            background: rgba(255, 107, 0, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            pointer-events: none;
        }

        .crosshair-line {
            position: absolute;
            background: rgba(0, 212, 255, 0.6);
        }

        .crosshair-line-h {
            width: 10px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
        }

        .crosshair-line-v {
            width: 2px;
            height: 10px;
            top: 50%;
            left: 50%;
            transform: translateY(-50%);
        }

        /* Kill Feed */
        .kill-feed {
            position: absolute;
            top: 20px;
            right: 180px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 300px;
            border-right: 3px solid #ff0000;
        }

        .kill-entry {
            font-size: 12px;
            color: #fff;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .kill-entry:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .killer-name {
            color: #ff6b00;
            font-weight: bold;
        }

        .victim-name {
            color: #ff0000;
            font-weight: bold;
        }

        /* Storm Warning */
        .storm-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            border-radius: 10px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .storm-warning.active {
            opacity: 1;
        }

        .storm-warning-text {
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
        }

        /* Main Menu */
        .main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: auto;
        }

        .menu-content {
            text-align: center;
        }

        .game-title {
            font-size: 60px;
            font-weight: bold;
            background: linear-gradient(45deg, #00d4ff, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .menu-button {
            padding: 15px 40px;
            font-size: 18px;
            margin: 10px;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            pointer-events: auto;
        }

        .menu-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }

        .hidden {
            display: none;
        }

        /* Game Over Screen */
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .game-over-screen.active {
            opacity: 1;
        }

        .game-over-content {
            text-align: center;
        }

        .game-over-title {
            font-size: 50px;
            font-weight: bold;
            color: #ff0000;
            margin-bottom: 20px;
        }

        .game-over-stats {
            font-size: 18px;
            color: #00d4ff;
            margin-bottom: 30px;
        }

        .game-over-button {
            padding: 15px 40px;
            font-size: 18px;
            margin: 10px;
            background: linear-gradient(45deg, #ff6b00, #ff0000);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            pointer-events: auto;
        }

        .game-over-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.8);
        }

        /* Controls Display */
        .controls-display {
            position: absolute;
            bottom: 350px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #ff6b00;
            font-size: 12px;
            max-width: 250px;
        }

        .control-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 107, 0, 0.3);
        }

        .control-item:last-child {
            border-bottom: none;
        }

        .control-key {
            background: rgba(255, 107, 0, 0.3);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 5px;
        }

        .players-left {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #00d4ff;
            font-size: 14px;
        }

        .players-count {
            font-size: 24px;
            font-weight: bold;
            color: #00d4ff;
        }

        :root {
            --night: #14231f;
            --panel: rgba(17, 32, 28, .9);
            --line: rgba(221, 232, 207, .18);
            --mint: #8be0be;
            --gold: #f3bd72;
            --paper: #f4f0df;
        }
        body { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; color: var(--paper); background: #25392b; }
        #gameContainer { isolation: isolate; }
        #canvas { image-rendering: auto; }
        .hud { display: none; }
        .hud > * { z-index: 2; }
        .main-menu {
            background: linear-gradient(90deg, rgba(12, 26, 23, .93) 0%, rgba(12, 26, 23, .79) 41%, rgba(12, 26, 23, .12) 100%),
                        linear-gradient(0deg, rgba(12, 26, 23, .35), transparent 50%), #344c38;
            align-items: flex-start;
            padding: clamp(36px, 9vw, 130px);
            text-align: left;
        }
        .menu-content { width: min(430px, 100%); text-align: left; }
        .menu-kicker, .eyebrow, .control-heading, .menu-form label, .menu-foot, .match-zone, .match-stats, .match-brand, .weapon-info > span, .weapon-info em, .game-over-stats span {
            font-size: 10px; font-weight: 800; letter-spacing: 1.5px;
        }
        .menu-kicker { color: var(--mint); display: flex; align-items: center; gap: 10px; }
        .menu-kicker i, .match-stats i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #83dfa9; box-shadow: 0 0 12px #83dfa9; }
        .game-title { margin: 24px 0 0; font-size: 82px; line-height: .92; letter-spacing: 0; color: var(--paper); background: none; -webkit-text-fill-color: currentColor; text-shadow: 0 5px 24px rgba(0, 0, 0, .3); }
        .menu-subtitle { margin-top: 12px; color: var(--gold); font-size: 14px; font-weight: 800; letter-spacing: 5px; }
        .menu-rule { width: 64px; height: 3px; margin: 26px 0 18px; background: var(--mint); }
        .menu-description { color: #d2d8c8; font-size: 16px; margin-bottom: 27px; }
        .menu-form { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; padding: 10px 13px; border: 1px solid var(--line); background: rgba(9, 20, 17, .4); }
        .menu-form label { color: #c8d2c3; }
        .menu-form select { appearance: none; border: 0; background: transparent; color: var(--paper); font: inherit; font-weight: 700; padding: 5px 20px 5px 8px; cursor: pointer; }
        .menu-form option { color: #14231f; }
        .menu-button, .game-over-button { width: 100%; display: flex; align-items: center; justify-content: space-between; margin: 0; padding: 16px 18px; border: 0; border-radius: 2px; background: var(--mint); color: var(--night); font-size: 13px; letter-spacing: 1px; font-weight: 900; cursor: pointer; transition: background .18s, transform .18s; }
        .menu-button:hover, .game-over-button:hover { background: #b7f1d4; transform: translateY(-2px); box-shadow: none; }
        .menu-button b, .game-over-button b { font-size: 21px; }
        .sound-button { display: block; margin: 15px auto 0 0; border: 0; background: transparent; color: #d4dccd; font: inherit; font-size: 11px; letter-spacing: 1px; cursor: pointer; }
        .sound-button:hover { color: var(--mint); }
        .menu-foot { margin-top: 28px; color: #c0cabc; font-size: 9px; line-height: 2; }
        .match-bar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: rgba(14, 27, 23, .87); border-bottom: 1px solid var(--line); }
        .match-brand { color: var(--paper); font-size: 12px; }.match-brand span { color: var(--mint); }
        .match-stats { display: flex; gap: clamp(12px, 3vw, 38px); color: #bdc8b9; font-size: 9px; }
        .match-stats span { display: flex; align-items: center; gap: 7px; }.match-stats b, .match-zone b { color: var(--paper); font-size: 13px; }
        .match-zone { display: grid; gap: 3px; color: #bdc8b9; text-align: right; font-size: 9px; }
        .players-left { top: 74px; left: 20px; min-width: 135px; padding: 11px 14px; border: 1px solid var(--line); border-left: 2px solid var(--mint); border-radius: 2px; background: var(--panel); }
        .eyebrow { color: #b8c9b7; font-size: 9px; }.players-count { margin-top: 3px; color: var(--paper); font-size: 27px; line-height: 1; }
        .minimap { top: 72px; right: 18px; width: 174px; height: 174px; border: 1px solid rgba(238, 237, 209, .58); border-radius: 2px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
        .player-stats { left: 20px; bottom: 20px; width: min(300px, 39vw); padding: 13px 15px; background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--mint); border-radius: 2px; }
        .stat-row { margin-bottom: 9px; font-size: 10px; }.stat-label { min-width: 77px; color: #d0d7c8; font-size: 9px; letter-spacing: .5px; }.stat-bar { height: 7px; margin: 0 9px; border-radius: 0; }.stat-bar-fill { border-radius: 0; }.health-bar .stat-bar-fill { background: #8bdfa6; }.shield-bar .stat-bar-fill { background: #76cde6; }
        .stat-value { min-width: 48px; font-size: 10px; }
        .inventory { right: 20px; bottom: 20px; width: 230px; min-width: 0; max-height: 280px; padding: 12px; border: 1px solid var(--line); border-right: 2px solid var(--gold); border-radius: 2px; background: var(--panel); }
        .inventory-title { margin-bottom: 8px; color: var(--gold); font-size: 9px; letter-spacing: 1.5px; }
        .inventory-item { min-height: 40px; gap: 8px; padding: 6px; margin-bottom: 4px; border: 1px solid transparent; border-left: 2px solid #708b75; border-radius: 1px; background: rgba(255,255,255,.055); font-size: 11px; }
        .inventory-item.selected { border-color: rgba(139,224,190,.6); border-left-color: var(--mint); background: rgba(139,224,190,.12); }
        .slot-num { color: #a6b5a5; font-size: 10px; }.inventory-item-name { display: grid; gap: 2px; }.inventory-item-name small { color: #b6c0b2; font-size: 8px; letter-spacing: .8px; }.inventory-item-count { padding: 4px 6px; border-radius: 1px; background: rgba(243,189,114,.17); color: var(--paper); }
        .controls-display { bottom: 176px; left: 20px; max-width: 270px; padding: 12px; border: 1px solid var(--line); border-left: 2px solid var(--gold); border-radius: 2px; background: var(--panel); font-size: 10px; }
        .control-heading { margin-bottom: 7px; color: var(--gold); }.control-heading span { color: #a8b7a5; }
        .control-item { display: flex; align-items: center; gap: 7px; margin: 0; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.08); }.control-key { min-width: 47px; padding: 3px 5px; border-radius: 1px; background: rgba(243,189,114,.16); color: #f1d5a5; text-align: center; font-size: 8px; }
        .crosshair { width: 24px; height: 24px; }.crosshair-line { background: rgba(246,241,220,.85); box-shadow: 0 1px 3px #25392b; }.crosshair-line-h { width: 7px; }.crosshair-line-v { height: 7px; }
        .kill-feed { top: 74px; right: 210px; max-width: 260px; padding: 7px 11px; border-right: 0; border-left: 2px solid #ed8c72; border-radius: 1px; background: rgba(17,32,28,.76); }.kill-entry { margin: 0; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 10px; }
        .storm-warning { top: 36%; padding: 12px 20px; border: 1px solid #a5e6fa; border-radius: 1px; background: rgba(62,117,159,.68); }.storm-warning-text { color: #f4f0df; font-size: 12px; letter-spacing: 1px; }
        .weapon-info { position: absolute; z-index: 3; bottom: 31px; left: 50%; transform: translateX(-50%); display: flex; align-items: baseline; gap: 9px; padding: 9px 15px; border: 1px solid var(--line); background: var(--panel); }
        .weapon-info > span { color: var(--gold); }.weapon-info strong { font-size: 24px; }.weapon-info i { color: #b8c4b4; font-size: 12px; font-style: normal; }.weapon-info em { color: var(--gold); font-style: normal; }
        .game-toast { position: absolute; z-index: 4; left: 50%; top: 19%; transform: translate(-50%, -8px); opacity: 0; padding: 10px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--paper); font-size: 11px; font-weight: 800; letter-spacing: 1px; transition: opacity .2s, transform .2s; pointer-events: none; }.game-toast.visible { opacity: 1; transform: translate(-50%, 0); }
        .build-mode { position: absolute; z-index: 3; left: 50%; bottom: 85px; transform: translateX(-50%); display: none; padding: 7px 11px; background: var(--panel); color: var(--gold); font-size: 9px; font-weight: 800; letter-spacing: 1px; }.build-mode.active { display: block; }
        .game-over-screen { background: rgba(12, 26, 23, .91); }.game-over-screen.hidden { display: none; }.game-over-content { width: min(480px, calc(100% - 40px)); }.game-over-title { margin-top: 16px; color: var(--paper); font-size: 42px; }.game-over-stats { display: flex; justify-content: space-between; gap: 10px; margin: 25px 0; }.game-over-stats div { display: grid; gap: 7px; text-align: left; }.game-over-stats span { color: #aebdae; }.game-over-stats strong { color: var(--mint); font-size: 25px; }.game-over-button { justify-content: center; }
        #touchControls { display: none; }
        @media (max-width: 760px) {
            .main-menu { padding: 36px 25px; background: linear-gradient(90deg, rgba(12,26,23,.94), rgba(12,26,23,.7)), #344c38; }
            .game-title { font-size: 58px; }.menu-description { font-size: 14px; }
            .match-bar { height: 52px; padding: 0 11px; }.match-brand { font-size: 10px; }.match-brand span { display: none; }.match-stats { gap: 10px; font-size: 8px; }.match-stats span { gap: 4px; }.match-stats span:last-child { display: none; }.match-zone { font-size: 8px; }.match-zone b { font-size: 11px; }
            .players-left { top: 62px; left: 10px; min-width: 90px; padding: 8px 10px; }.minimap { top: 62px; right: 10px; width: 126px; height: 126px; }.kill-feed { top: 198px; right: 10px; max-width: 170px; }
            .player-stats { left: 10px; bottom: 12px; width: 43vw; padding: 8px; }.stat-label { min-width: 55px; font-size: 8px; }.stat-value { min-width: 38px; font-size: 9px; }.stat-bar { margin: 0 5px; }
            .inventory { right: 10px; bottom: 12px; width: 43vw; padding: 8px; }.inventory-item { min-height: 32px; padding: 4px; }.inventory-title { margin-bottom: 4px; }
            .controls-display { display: none; }.weapon-info { bottom: 142px; padding: 6px 10px; }.weapon-info strong { font-size: 18px; }.build-mode { bottom: 188px; }
            #touchControls.visible { display: block; }.touch-stick { position: absolute; left: 22px; bottom: 146px; width: 100px; height: 100px; border: 1px solid rgba(244,240,223,.4); border-radius: 50%; background: rgba(17,32,28,.42); touch-action: none; }.touch-stick span { position: absolute; left: 50%; top: 50%; width: 39px; height: 39px; transform: translate(calc(-50% + var(--sx, 0px)), calc(-50% + var(--sy, 0px))); border-radius: 50%; background: rgba(139,224,190,.75); }.touch-action { position: absolute; z-index: 5; width: 58px; height: 58px; border: 1px solid rgba(244,240,223,.5); border-radius: 50%; background: rgba(17,32,28,.7); color: var(--paper); font-size: 9px; font-weight: 800; touch-action: none; }.touch-fire { right: 22px; bottom: 148px; width: 72px; height: 72px; background: rgba(176,84,61,.8); }.touch-build { right: 105px; bottom: 222px; }.touch-heal { right: 105px; bottom: 140px; }
        }
        .inventory, .touch-stick, .touch-action { pointer-events: auto; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        
        <!-- Main Menu -->
        <div id="mainMenu" class="main-menu">
            <div class="menu-content">
                <div class="game-title">GAMEFORT</div>
                <p style="font-size: 18px; color: #00d4ff; margin-bottom: 40px;">Battle Royale</p>
                <button class="menu-button" onclick="startGame()">Start Game</button>
                <button class="menu-button" onclick="showInstructions()">How to Play</button>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud" class="hud">
            <!-- Players Left -->
            <div class="players-left">
                <div>Players Left:</div>
                <div class="players-count" id="playersLeft">99</div>
            </div>

            <!-- Minimap -->
            <div class="minimap">
                <canvas id="minimapCanvas" class="minimap-canvas"></canvas>
            </div>

            <!-- Player Stats -->
            <div class="player-stats">
                <div class="stat-row health-bar">
                    <div class="stat-label">HP</div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" id="healthBar" style="width: 100%"></div>
                    </div>
                    <div class="stat-value"><span id="healthValue">100</span>/100</div>
                </div>
                <div class="stat-row shield-bar">
                    <div class="stat-label">Shield</div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" id="shieldBar" style="width: 100%"></div>
                    </div>
                    <div class="stat-value"><span id="shieldValue">50</span>/50</div>
                </div>
            </div>

            <!-- Inventory -->
            <div class="inventory">
                <div class="inventory-title">Inventory</div>
                <div id="inventoryList"></div>
            </div>

            <!-- Controls Display -->
            <div class="controls-display">
                <div class="control-item"><span class="control-key">WASD</span>Move</div>
                <div class="control-item"><span class="control-key">Space</span>Jump</div>
                <div class="control-item"><span class="control-key">Mouse</span>Aim/Look</div>
                <div class="control-item"><span class="control-key">Click</span>Shoot</div>
                <div class="control-item"><span class="control-key">E</span>Build</div>
                <div class="control-item"><span class="control-key">Q</span>Use Item</div>
                <div class="control-item"><span class="control-key">R</span>Reload</div>
            </div>

            <!-- Crosshair -->
            <div class="crosshair">
                <div class="crosshair-line crosshair-line-h"></div>
                <div class="crosshair-line crosshair-line-v"></div>
            </div>

            <!-- Kill Feed -->
            <div class="kill-feed" id="killFeed"></div>

            <!-- Storm Warning -->
            <div class="storm-warning" id="stormWarning">
                <div class="storm-warning-text">⚠️ STORM INCOMING ⚠️</div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="game-over-screen">
            <div class="game-over-content">
                <div class="game-over-title" id="gameOverTitle">YOU DIED!</div>
                <div class="game-over-stats">
                    <p>Place: <span id="finalPlace">-</span></p>
                    <p>Kills: <span id="finalKills">0</span></p>
                    <p>Damage Dealt: <span id="finalDamage">0</span></p>
                </div>
                <button class="game-over-button" onclick="returnToMenu()">Return to Menu</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="game3d.js"></script>
</body>
</html>
